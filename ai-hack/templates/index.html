<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SafeLLM Hub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 2rem;
        background: #f5f7fb;
      }
      .model-item {
        cursor: pointer;
      }
      .chat-box {
        max-height: 300px;
        overflow-y: auto;
      }
    </style>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad"
      defer
    ></script>
  </head>
  <body>
    <div class="container">
      <div
        class="d-flex justify-content-between align-items-center"
        style="margin-bottom: 6px"
      >
        <div>
          <h1 class="h3">🔮 SafeLLM Hub</h1>
          <div class="text-muted" style="padding-left: 4px">
            和你的 GGUF 模型聊天！
          </div>
        </div>
        <div>
          <button id="refreshBtn" class="btn btn-outline-secondary">
            刷新模型
          </button>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-5">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title mb-3">上传模型 (.gguf)</h5>
              <input
                class="form-control my-3"
                type="file"
                id="fileInput"
                accept=".gguf"
              />
              <button id="uploadBtn" class="btn btn-primary" disabled>
                上传
              </button>
              <div id="uploadStatus" class="mt-3 px-1"></div>
              <div id="uploadProgressContainer" class="mt-2" style="display:none;">
                <div class="progress">
                  <div id="uploadProgress" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                </div>
              </div>
              <!-- Turnstile 验证 Modal -->
              <div
                class="modal fade"
                id="turnstileModal"
                tabindex="-1"
                aria-hidden="true"
              >
                <div class="modal-dialog modal-dialog-centered">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title">请完成验证</h5>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                      ></button>
                    </div>
                    <div class="modal-body">
                      <div id="widget-container"></div>
                      <div id="turnstileHelp" class="small text-muted mt-2">
                        完成验证以继续上传
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="card mt-3">
            <div class="card-body">
              <h5 class="card-title">内置模型</h5>
              <ul id="builtinModelList" class="list-group list-group-flush"></ul>
            </div>
          </div>

          <div class="card mt-3">
            <div class="card-body">
              <h5 class="card-title">已上传模型(你最多可以上传 2 个模型)</h5>
              <ul id="modelList" class="list-group list-group-flush"></ul>
            </div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">聊天</h5>
              <div id="chatStatus" class="mb-2">请先选择模型</div>
              <div
                id="chatBox"
                class="border rounded p-3 mb-3 chat-box bg-white"
              ></div>
              <div class="d-flex gap-2">
                <input
                  id="messageInput"
                  class="form-control flex-grow-1"
                  placeholder="输入问题..."
                  disabled
                />
                <button
                  id="sendBtn"
                  class="btn btn-success text-nowrap"
                  disabled
                >
                  发送
                </button>
                <a
                  href="/flag"
                  class="btn btn-success text-nowrap"
                  style="display: none;"
                  disabled
                >
                  点击获得flag
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const AUTH_HEADER = { Authorization: "Bearer employee_access_token" };
  let selectedModel = null;
  let selectedModelIsBuiltin = false;

      const fileInput = document.getElementById("fileInput");
      const uploadBtn = document.getElementById("uploadBtn");
      const uploadStatus = document.getElementById("uploadStatus");
      const modelList = document.getElementById("modelList");
      const chatBox = document.getElementById("chatBox");
      const chatStatus = document.getElementById("chatStatus");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      const refreshBtn = document.getElementById("refreshBtn");

      fileInput.addEventListener("change", () => {
        uploadBtn.disabled = !fileInput.files.length;
      });

      async function getInfo() {
        try {
          const res = await fetch("/api/info");
          const data = await res.json();
          if (res.ok) {
          } else {
            showStatus("获取信息失败", "danger");
          }
        } catch (error) {
          showStatus("网络错误", "danger");
        }
      }

      let turnstileWidgetId = null;
      let turnstileToken = null;
      let widgetRendered = false;
      function renderTurnstile() {
        const container = document.getElementById("widget-container");
        if (container) container.innerHTML = "";
        turnstileToken = null;
        widgetRendered = false;
        try {
          if (
            turnstileWidgetId !== null &&
            typeof turnstile.reset === "function"
          ) {
            try {
              turnstile.reset(turnstileWidgetId);
            } catch (e) {
              /* ignore */
            }
            turnstileWidgetId = null;
          }
        } catch (e) {
          /* ignore */
        }

        if (!widgetRendered) {
          turnstileWidgetId = turnstile.render("#widget-container", {
            sitekey: "0x4AAAAAAB7lgsn7kb58ULZu",
            theme: "light",
            callback: function (token) {
              console.log("Challenge completed:", token);
              turnstileToken = token;
              const modalEl = document.getElementById("turnstileModal");
              const modal = bootstrap.Modal.getInstance(modalEl);
              if (modal) modal.hide();
              doUploadWithToken();
            },
          });
          widgetRendered = true;
        }
      }

      uploadBtn.addEventListener("click", () => {
        if (!fileInput.files.length) return;
        const modalEl = document.getElementById("turnstileModal");
        const modal = new bootstrap.Modal(modalEl);
        turnstileToken = null;
        const container = document.getElementById("widget-container");
        if (container) container.innerHTML = "";
        modal.show();
        modalEl.addEventListener("shown.bs.modal", function handler() {
          renderTurnstile();
          modalEl.removeEventListener("shown.bs.modal", handler);
        });
        modalEl.addEventListener("hidden.bs.modal", function cleanup() {
          try {
            if (container) container.innerHTML = "";
          } catch (e) {
            /* ignore */
          }
          widgetRendered = false;
          turnstileWidgetId = null;
          turnstileToken = null;
          modalEl.removeEventListener("hidden.bs.modal", cleanup);
        });
      });

      function doUploadWithToken() {
        if (!fileInput.files.length) return;
        const f = fileInput.files[0];
        if (!f.name.endsWith(".gguf")) {
          showStatus("仅支持 .gguf");
          return;
        }

        const fd = new FormData();
        fd.append("file", f);
        if (turnstileToken) fd.append("turnstile_token", turnstileToken);
        uploadBtn.disabled = true;
        showStatus("上传中...", "info");

        const progressContainer = document.getElementById('uploadProgressContainer');
        const progressBar = document.getElementById('uploadProgress');
        if (progressContainer && progressBar) {
          progressContainer.style.display = '';
          progressBar.style.width = '0%';
          progressBar.textContent = '0%';
        }

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload', true);
        // set auth header
        for (const k of Object.keys(AUTH_HEADER)) {
          xhr.setRequestHeader(k, AUTH_HEADER[k]);
        }

        xhr.upload.onprogress = function (e) {
          if (e.lengthComputable && progressBar) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
          }
        };

        xhr.onreadystatechange = function () {
          if (xhr.readyState === XMLHttpRequest.DONE) {
            uploadBtn.disabled = false;
            turnstileToken = null;
            try {
              const data = JSON.parse(xhr.responseText || '{}');
              if (xhr.status >= 200 && xhr.status < 300) {
                showStatus('上传成功', 'success');
                loadModels();
                fileInput.value = '';
              } else {
                showStatus(data.error || ('上传失败: ' + xhr.status), 'danger');
              }
            } catch (e) {
              showStatus('上传失败: 无效响应', 'danger');
            }
            // hide progress after short delay
            if (progressContainer) setTimeout(() => (progressContainer.style.display = 'none'), 800);
          }
        };

        xhr.onerror = function () {
          uploadBtn.disabled = false;
          turnstileToken = null;
          showStatus('上传失败: 网络错误', 'danger');
          if (progressContainer) progressContainer.style.display = 'none';
        };

        xhr.send(fd);
      }
      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          if (!sendBtn.disabled) sendBtn.click();
        }
      });
      function showStatus(msg, type = "info") {
        uploadStatus.innerHTML = `<div class="alert alert-${
          type === "info" ? "secondary" : type
        } p-2">${msg}</div>`;
        setTimeout(() => (uploadStatus.innerHTML = ""), 4000);
      }
      async function loadModels() {
        modelList.innerHTML = '<li class="list-group-item">加载中...</li>';
        const builtinList = document.getElementById("builtinModelList");
        if (builtinList) builtinList.innerHTML = '<li class="list-group-item">加载中...</li>';
        try {
          const res = await fetch("/api/models", { headers: AUTH_HEADER });
          const data = await res.json();
          modelList.innerHTML = "";
          if (builtinList) builtinList.innerHTML = "";
          if (data.models && data.models.length) {
            // 将 builtin 模型与用户模型分离渲染
            data.models.forEach((m) => {
              const isBuiltin = m.builtin === true || (typeof m.name === 'string' && m.name.startsWith('static/'));
              const li = document.createElement("li");
              li.className =
                "list-group-item d-flex justify-content-between align-items-center model-item";
              const nameLabel = document.createElement('span');
              nameLabel.textContent = m.name;
              if (isBuiltin) {
                const badge = document.createElement('span');
                badge.className = 'badge bg-info text-dark ms-2';
                badge.textContent = '内置';
                nameLabel.appendChild(badge);
              }
              const btnGroup = document.createElement('span');
              btnGroup.className = 'btn-group';
              const selectBtn = document.createElement('button');
              selectBtn.className = 'btn btn-sm btn-outline-primary select-btn';
              selectBtn.textContent = '选择';
              selectBtn.addEventListener('click', () => selectModel(m.name, isBuiltin));
              btnGroup.appendChild(selectBtn);

              // 只有非内置模型显示删除按钮
              if (!isBuiltin) {
                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-sm btn-outline-danger delete-btn';
                delBtn.textContent = '删除';
                delBtn.addEventListener('click', () => deleteModel(m.name));
                btnGroup.appendChild(delBtn);
              }

              li.appendChild(nameLabel);
              li.appendChild(btnGroup);

              if (isBuiltin && builtinList) {
                builtinList.appendChild(li);
              } else {
                modelList.appendChild(li);
              }
            });
          } else {
            if (builtinList) builtinList.innerHTML = '<li class="list-group-item">暂无内置模型</li>';
            modelList.innerHTML = '<li class="list-group-item">暂无模型</li>';
          }
        } catch (e) {
          if (builtinList) builtinList.innerHTML = '<li class="list-group-item text-danger">加载失败</li>';
          modelList.innerHTML = '<li class="list-group-item text-danger">加载失败</li>';
        }
      }
      function selectModel(name, isBuiltin = false) {
        selectedModel = name;
        selectedModelIsBuiltin = !!isBuiltin;
        chatStatus.innerHTML = `<span class="badge bg-success">已选择: ${name}</span>`;
        messageInput.disabled = false;
        sendBtn.disabled = false;
        chatBox.innerHTML = "";
      }
      async function deleteModel(name) {
        if (!confirm(`确定删除 ${name} ?`)) return;
        try {
          const res = await fetch(`/api/models/${encodeURIComponent(name)}`, {
            method: "DELETE",
            headers: AUTH_HEADER,
          });
          if (res.ok) {
            loadModels();
            showStatus("删除成功", "success");
            if (selectedModel === name) {
              selectedModel = null;
              chatStatus.innerText = "请先选择模型";
              messageInput.disabled = true;
              sendBtn.disabled = true;
            }
          } else {
            const d = await res.json();
            showStatus(d.error || "删除失败", "danger");
          }
        } catch (e) {
          showStatus("删除失败: " + e.message, "danger");
        }
      }
      sendBtn.addEventListener("click", async () => {
        const msg = messageInput.value.trim();
        if (!msg || !selectedModel) return;
        appendMessage("user", msg);
        messageInput.value = "";
        messageInput.disabled = true;
        sendBtn.disabled = true;
        const previousStatus = chatStatus.innerHTML;
        chatStatus.innerHTML =
          '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>思考中...';
        try {
          const res = await fetch(
            `/api/chat/${encodeURIComponent(selectedModel)}`,
            {
              method: "POST",
              headers: { ...AUTH_HEADER, "Content-Type": "application/json" },
              body: JSON.stringify({ message: msg, isBuiltin: selectedModelIsBuiltin }),
            }
          );
          const d = await res.json();
          if (res.ok) {
            appendMessage("bot", d.response || "");
          } else {
            appendMessage("bot", d.error || "聊天失败");
          }
        } catch (e) {
          appendMessage("bot", "错误: " + e.message);
        }
        chatStatus.innerHTML = previousStatus;
        messageInput.disabled = false;
        sendBtn.disabled = false;
      });
      function appendMessage(sender, text) {
        const el = document.createElement("div");
        el.className = sender === "user" ? "text-end mb-2" : "text-start mb-2";
        el.innerHTML = `<div class="d-inline-block p-2 rounded ${
          sender === "user" ? "bg-primary text-white" : "bg-light text-dark"
        }">${escapeHtml(text)}</div>`;
        chatBox.appendChild(el);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      function escapeHtml(s) {
        return (s || "")
          .toString()
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }
      refreshBtn.addEventListener("click", loadModels);
      loadModels();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
