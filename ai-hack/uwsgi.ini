[uwsgi]
master = true
processes = 2
threads = 1
single-interpreter = true

# 使用 HTTP 模式在容器内监听（也可改为 unix socket）
http = 0.0.0.0:5052

# 限制超时（防止长期卡住）
harakiri = 10
death-after = 45

# 载入 flask 应用
chdir = /home/ctfapp/app/app
module = app:app

# 避免 uwsgi 尝试降权为 root（镜像已切换用户）
uid = 1001
gid = 1001

# 日志（写入 stdout，容器层面收集）
pidfile = /dev/stdout

[uwsgi]
disable-log-rotation = true
