<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>我已经完全掌握了 FORMAT STRING</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #00ffff 0%, #ffff00 45%, #ff0055 100%);
      font-family: "Impact", "Comic Sans MS", -apple-system, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border: 8px solid #000;
      border-radius: 20px;
      padding: 36px 42px;
      width: min(94%, 680px);
      box-shadow: 16px 18px 0 #000;
      transform: rotate(-1deg);
    }

    h2 {
      margin-top: 0;
      font-size: 32px;
      color: #ff0055;
      text-shadow: 2px 2px 0 #ffff00;
    }

    p {
      font-family: -apple-system, sans-serif;
      font-size: 15px;
      font-weight: bold;
      color: #333;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 4px solid #000;
      font-family: monospace;
      font-size: 16px;
      margin: 12px 0 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #000;
      color: #00ffff;
      border: 0;
      font-family: inherit;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 #ff0055;
    }

    button:hover {
      background: #ff0055;
      color: #ffff00;
    }

    .out-box {
      margin-top: 24px;
      background: #000;
      color: #00ff66;
      padding: 16px;
      border-radius: 8px;
      font-family: monospace;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #000;
      font-family: -apple-system, sans-serif;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>高雅问候语生成器</h2>
    <p>
      我说我已经完全掌握了 FORMAT STRING，你👂🐉吗？<br />
      告诉我你的名字，让我的“高雅问候语生成器”问候问候你！
    </p>
    <form method="POST">
      <input name="name" placeholder="输入你的名字..." value="{{ name or '' }}" required>
      <button>🚀 生成高雅问候 🚀</button>
    </form>

    {% if result %}
    <div class="out-box">
      <strong>[SERVER GREETING]:</strong>
      <div>{{ result }}</div>
    </div>
    {% endif %}

    <a href="/" class="back">← 返回首页</a>
  </div>
</body>

</html>
