    @keyframes rainbow-text {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    @keyframes spin-cow {
      0% {
        transform: rotate(0deg) scale(1);

      }

      font-size: 26px;
      font-weight: 900;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      z-index: 6;
      animation: float-badge 2s infinite ease-in-out;
    }

    .badge-1 {
      top: 6%;
      right: 12%;
      background: #ffff00;
      color: #ff0000;
      transform: rotate(18deg);
    }

    .badge-2 {

      text-align: right;
      z-index: 2;
      pointer-events: none;
    }

    .btn-showcase {
      display: flex;
      justify-content: center;
      gap: 36px;
      margin: 100px 0 40px;
      position: relative;
      z-index: 20;
      flex-wrap: wrap;
    }

    .master-btn {
      flex: 1;
      min-width: 320px;
      max-width: 460px;

      border-radius: 18px;

    .master-btn:hover {

      box-shadow: 18px 20px 0 #000;
    }

    .master-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 4px 4px 0 #000;
    }

    .btn-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-shadow: 2px 2px 0 #fff;
    }

    .btn-subtitle {
      font-size: 15px;
      font-weight: 800;
      color: #333;
