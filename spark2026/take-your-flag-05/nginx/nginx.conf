daemon off;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /opt/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include                 mime.types;
    default_type            application/octet-stream;
    sendfile                on;
    keepalive_timeout       65;
    client_max_body_size    64k;
    client_body_buffer_size 16k;
    include                 upstream.conf;

    map $http_content_type $is_json {
        application/json 1;
    }

    json_set $goods $request_body goods;

    map $request_body $goods_case_alias {
        default                    0;
        '~"(?!goods")(?i:goods")'  1;
    }

    # 秘宝商品编码只允许内网客服系统操作下单/退款
    map $goods $is_flag_goods {
        "~^FLAG-ITEM$" 1;
        default        0;
    }

    server {
        listen 8000;
        server_name _;
        root /opt/nginx/html;
        index index.html;

        # 最新最热的 nginx 特性 https://blog.nginx.org/blog/nginx-routing-on-http-request-body
        client_body_early_read $is_json;

        location /api/status {
            proxy_pass http://order_api;
            proxy_set_header Host $host;
        }

        location /api/catalog {
            proxy_pass http://order_api;
            proxy_set_header Host $host;
        }

        location /api/order {
            if ($goods = "")        { return 403; }
            if ($goods_case_alias)  { return 400; }
            if ($is_flag_goods)     { return 403; }

            proxy_pass http://order_api;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
