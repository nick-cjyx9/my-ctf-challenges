<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Slay The Deadline</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }

        .flash {
            color: green;
            background: #eeffee;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid green;
        }

        .todo {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">主页</a>
        {% if session.username %}
        | <span>Welcome, {{ session.username }}</span>
        | <a href="/logout">登出</a>
        {% else %}
        | <a href="/login">登录</a>
        | <a href="/register">注册</a>
        {% endif %}
    </nav>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash">
        {% for message in messages %}
        <div>{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>

</html>
