<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JNSEC Geosint</title>
    <link rel="icon" href="/img/icons/hacker.ico">
    <link rel="stylesheet" href="/vendor/photo-sphere-viewer/core/index.css">
    <link rel="stylesheet" href="/css/chall.css">
    <script type="importmap">
        {
            "imports": {
                "three": "/vendor/three/three.module.js",
                "@photo-sphere-viewer/core": "/vendor/photo-sphere-viewer/core/index.module.js",
                "@photo-sphere-viewer/equirectangular-tiles-adapter": "/vendor/photo-sphere-viewer/tiles/index.module.js"
            }
        }
    </script>
</head>

<body>
    <main id="pano" aria-label="Challenge panorama"></main>
    <aside id="controls">
        <div id="map-panel">
            <div id="challenge-controls">
                <section id="hud">
                    <h1 id="chall-title">Loading challenge…</h1>
                    <p id="chall-result" aria-live="polite">Select the location shown in the panorama.</p>
                </section>
                <section id="map-box" aria-label="Location guess">
                    <div id="map"></div>
                    <form id="coordinate-entry" aria-label="Enter coordinates manually">
                        <input id="latitude" name="latitude" type="number" min="-90" max="90" step="any"
                            placeholder="Latitude" aria-label="Latitude">
                        <input id="longitude" name="longitude" type="number" min="-180" max="180" step="any"
                            placeholder="Longitude" aria-label="Longitude">
                        <button type="submit" id="locate">Locate</button>
                    </form>
                    <button type="button" id="submit" disabled>Select a location</button>
                </section>
            </div>
            <button type="button" id="map-toggle" aria-controls="challenge-controls" aria-expanded="true"
                aria-label="Hide challenge controls" title="Hide challenge controls">
                <span class="collapse-icon" aria-hidden="true">−</span>
                <svg class="map-icon" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="m3.5 5.5 5-2.5 7 2.5 5-2.5v15.5l-5 2.5-7-2.5-5 2.5V5.5Zm5 11 7 2.5V7.5L8.5 5v11.5Z" />
                </svg>
            </button>
        </div>
    </aside>
    <script type="module" src="/js/chall.js"></script>
</body>

</html>
